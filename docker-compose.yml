services:
  banco:
    image: pgvector/pgvector:pg17
    container_name: agente-banco
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agente
    ports:
      - "127.0.0.1:5440:5432"
    mem_limit: 256m
    volumes:
      - agente-banco:/var/lib/postgresql/data
      - ./db/dev-init.sql:/docker-entrypoint-initdb.d/01-dev-init.sql:ro
volumes:
  agente-banco:
